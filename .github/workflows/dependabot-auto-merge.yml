name: Dependabot auto-merge

# Turns on GitHub's native auto-merge (squash) for Dependabot PRs with patch and minor
# updates. GitHub then merges on its own as soon as every required status check of `main`
# (CI `verify`, SCA scan) has passed: the pipeline is never bypassed and no runner sits
# polling. Major updates, non-semver updates (e.g. SHA-pinned refs without a version) and
# updates whose package changed maintainers stay open for manual review.
#
# Auto-merge is enabled with a GitHub App token, not GITHUB_TOKEN: a merge carried out on
# behalf of GITHUB_TOKEN triggers no workflow runs, so CI, docker-publish and the SCA
# manifest update would silently not run on main after the merge. Setup: CONTRIBUTING.md.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to the PR (e.g. a Dependabot rebase) cancels the older run.
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # turn auto-merge off again with GITHUB_TOKEN (see last step)
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # Only when Dependabot triggered the run: the action also verifies that every
        # commit on the PR was authored by Dependabot and fails otherwise.
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Decide whether the update is eligible
        id: policy
        env:
          ACTOR: ${{ github.actor }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          set -euo pipefail
          eligible=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch | version-update:semver-minor) eligible=true ;;
          esac
          # A new maintainer on a package is a supply-chain signal: review by hand.
          if [ "$MAINTAINER_CHANGES" = "true" ]; then
            eligible=false
          fi
          # Someone other than Dependabot pushed to the PR: it no longer contains only
          # Dependabot's change, so it must not be merged without a human.
          if [ "$ACTOR" != "dependabot[bot]" ]; then
            eligible=false
          fi
          echo "Dependencies: ${DEPENDENCIES:-<none>}"
          echo "Actor: $ACTOR, update type: ${UPDATE_TYPE:-<none>}, maintainer changes: ${MAINTAINER_CHANGES:-<none>} -> eligible=$eligible"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      # `gh pr merge --auto` merges immediately (instead of enabling auto-merge) when the
      # PR is already mergeable. Without required checks on main that would merge before
      # the pipeline has run, so refuse unless main requires them (fail closed).
      - name: Verify that main requires the pipeline checks
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REQUIRED_CHECKS: verify # space-separated status check names
        run: |
          set -euo pipefail
          # Repository rulesets and classic branch protection can both require checks.
          from_rulesets=$(gh api "repos/$GH_REPO/rules/branches/$BASE_REF" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')
          from_protection=$(gh api "repos/$GH_REPO/branches/$BASE_REF" \
            --jq '.protection.required_status_checks.contexts // [] | .[]')
          required=$(printf '%s\n%s\n' "$from_rulesets" "$from_protection" | sed '/^$/d' | sort -u)
          echo "Required checks on $BASE_REF: $(echo "$required" | paste -sd ' ' -)"
          missing=''
          for check in $REQUIRED_CHECKS; do
            grep -qxF -- "$check" <<< "$required" || missing="$missing $check"
          done
          if [ -n "$missing" ]; then
            echo "::error::$BASE_REF does not require the status check(s):$missing. Not enabling auto-merge - see CONTRIBUTING.md."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        if: steps.policy.outputs.eligible == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Dependabot-triggered runs only see Dependabot secrets, so both live there.
          client-id: ${{ secrets.DEPENDABOT_AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_AUTOMERGE_APP_PRIVATE_KEY }}
          # Scoped to this repository (default) and to what a merge needs. `workflows`
          # is required to merge GitHub Actions updates that touch .github/workflows/.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge (squash)
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --match-head-commit: refuse if the branch moved after this run was triggered.
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

      # Auto-merge stays on across later pushes. If the PR is no longer eligible (foreign
      # push, Dependabot switched it to a major version), switch it off again.
      - name: Disable auto-merge for an ineligible PR
        if: always() && steps.policy.outputs.eligible == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$enabled" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "::notice::Auto-merge disabled - the PR needs a manual review."
          else
            echo "Auto-merge is not enabled - nothing to do."
          fi
